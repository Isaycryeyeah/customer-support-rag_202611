services:
  backend:
    build: .
    container_name: customer-support-rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: .
    container_name: customer-support-rag-frontend
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - BACKEND_API_URL=http://backend:8000
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    depends_on:
      - backend

services:
  backend:
    build: .
    container_name: customer-support-rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: python:3.10-slim
    container_name: customer-support-rag-frontend
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - BACKEND_API_URL=http://backend:8000
    command: >
      sh -c "pip install streamlit requests &&
             streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - backend

services:
  backend:
    build: .
    image: customer-support-rag:validation
    ports:
      - "127.0.0.1:8003:8000"
    env_file: .env
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ${HF_CACHE_DIR:?Set HF_CACHE_DIR to the local Hugging Face hub cache}:/root/.cache/huggingface/hub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 36
  frontend:
    image: customer-support-rag:validation
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8503:8501"
    depends_on:
      backend:
        condition: service_healthy
